{% extends "base.html" %}{% block content %}<section class="container page-section"><div class="d-flex justify-content-between align-items-center"><h1>Mis objetivos</h1><a class="btn btn-primary" href="{% url 'perfiles:objetivo_nuevo' %}">Nuevo</a></div>{% for objetivo in objetivos %}<div class="glass-card mt-3 d-flex justify-content-between"><strong>{{ objetivo.get_tipo_objetivo_display }}</strong><span><a href="{% url 'perfiles:objetivo_editar' objetivo.pk %}">Editar</a> · <a href="{% url 'perfiles:objetivo_eliminar' objetivo.pk %}">Eliminar</a></span></div>{% empty %}<div class="empty-state">Aún no tienes objetivos.</div>{% endfor %}</section>{% endblock %}
